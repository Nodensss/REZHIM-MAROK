plugins { id 'com.android.application' }

android { namespace 'ru.tomskneftekhim.rezhim'; compileSdk 35
    defaultConfig { applicationId 'ru.tomskneftekhim.rezhim.full'; minSdk 26; targetSdk 34; versionCode 4; versionName '3.1' }
    // Photos are already compressed; stored uncompressed they can be decoded region by region straight from the APK.
    androidResources { noCompress += ['jpg', 'jpeg', 'png'] }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    // Signed with the same local key as versions 1.3 and 2.0, so the APK installs over them and keeps phone data.
    buildTypes { release { signingConfig signingConfigs.debug; minifyEnabled false } }
    lint { checkReleaseBuilds false }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
