# Tests on every push. The APK is built from data/ + android/ and published as a Release asset
# when the workflow is started by hand (Actions → Android APK → Run workflow) or a tag v* is pushed.
name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python dependencies
        run: pip install -r requirements.txt
      - name: PC tests
        run: python -m unittest discover -s tests -v
      - name: Mobile web tests
        run: node --test tests/domain.test.mjs tests/intake.test.mjs
      - name: Database snapshot and photos for the APK
        run: python -m rezhim.android_snapshot

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # The ubuntu runner ships the Android SDK (ANDROID_HOME); android-actions/setup-android failed
      # there with «Failed to find package 'tools'», so the preinstalled SDK is used as is.
      - name: Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"

      # The same key as the local builds, so a CI APK installs over the one on the phone and keeps its data.
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::Secret DEBUG_KEYSTORE_BASE64 is missing: the APK would not install over the existing one."
            exit 1
          fi
          mkdir -p ~/.android
          echo "$KEYSTORE" | base64 -d > ~/.android/debug.keystore

      - name: JVM tests and APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Publish APK to the release of its version
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -oP "versionName '\K[^']+" android/app/build.gradle)
          apk="Marki-UPE-$version.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" --target "$GITHUB_SHA" --title "Режимы марок УПЭ $version" \
              --notes "Собрано автоматически из коммита $GITHUB_SHA."
          fi
