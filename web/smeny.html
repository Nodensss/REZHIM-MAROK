<title>Смены марок УПЭ</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@500&display=swap">
<style>
/* Layout: a month calendar on top, then a chronological feed — one plain-language card per grade change. */
:root{
  --bg:#f2f4f1; --surface:#fcfdfb; --surface-2:#e9ede8; --ink:#101a16; --ink-2:#47524c; --muted:#7c8781;
  --line:#dde2dc; --accent:#123f32; --focus:#2a78d6;
  --up:#c43d37; --down:#2468b8;
  --g1:#2a78d6; --g2:#eb6834; --g3:#1baf7a; --g4:#eda100; --g5:#e87ba4; --g6:#008300; --g7:#6250d6; --g8:#e34948; --g0:#8d958f;
  --z1:#86b6ef; --z2:#2a78d6; --z3:#184f95; --z1-ink:#0d366b; --z-ink:#ffffff;
  --warn-bg:#fbf1dc; --warn-ink:#6b4a00;
  --display:"Unbounded","Golos Text",system-ui,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1412; --surface:#161e1b; --surface-2:#212b27; --ink:#eef1ed; --ink-2:#bec7c1; --muted:#87928c;
  --line:#2a3430; --accent:#7fc4a8; --focus:#6da7ec;
  --up:#ef7a74; --down:#6da7ec;
  --g1:#3987e5; --g2:#d95926; --g3:#199e70; --g4:#c98500; --g5:#d55181; --g6:#008300; --g7:#9085e9; --g8:#e66767; --g0:#6e7771;
  --z1:#86b6ef; --z2:#3987e5; --z3:#1c5cab; --z1-ink:#0d366b; --z-ink:#ffffff;
  --warn-bg:#352a12; --warn-ink:#f3cf7a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1412; --surface:#161e1b; --surface-2:#212b27; --ink:#eef1ed; --ink-2:#bec7c1; --muted:#87928c;
  --line:#2a3430; --accent:#7fc4a8; --focus:#6da7ec;
  --up:#ef7a74; --down:#6da7ec;
  --g1:#3987e5; --g2:#d95926; --g3:#199e70; --g4:#c98500; --g5:#d55181; --g6:#008300; --g7:#9085e9; --g8:#e66767; --g0:#6e7771;
  --z1:#86b6ef; --z2:#3987e5; --z3:#1c5cab; --z1-ink:#0d366b; --z-ink:#ffffff;
  --warn-bg:#352a12; --warn-ink:#f3cf7a; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--body)}
.wrap{max-width:860px;margin:0 auto;padding-block:24px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
.wrap>*{min-width:0}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font:500 clamp(24px,5vw,32px)/1.15 var(--display);letter-spacing:-.01em}
h2.month{font:500 18px/1.2 var(--display);padding-top:10px;scroll-margin-top:12px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.lead{display:grid;gap:8px}
.lead p{margin:0;color:var(--ink-2);max-width:62ch}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.gp{display:inline-flex;align-items:center;gap:6px;font-weight:600;white-space:nowrap}
.gp::before{content:"";width:11px;height:11px;border-radius:3px;background:var(--c);flex:none}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.mon{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;display:grid;gap:6px;text-align:left;align-content:start;min-height:70px}
.mon:disabled{cursor:default;opacity:.55}
.mon .mname{font-size:14px;font-weight:600;display:grid;gap:0;line-height:1.25}
.mon .mname span{font-weight:500;color:var(--muted);font-size:12px}
.mon .seq{display:flex;flex-wrap:wrap;gap:3px 4px;align-items:center;font-size:12px;color:var(--muted)}
.mon .seq i{display:inline-block;width:14px;height:8px;border-radius:3px;background:var(--c)}
.mon.has{border-color:var(--ink-2)}
.mon.has .mname span{color:var(--ink-2)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink-2)}

/* controls */
.controls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.controls .lbl{font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13px}
.chip[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);font-weight:600}
.seg{display:inline-flex;background:var(--surface-2);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:6px;padding:5px 11px;font-size:13px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14);font-weight:600}
.check{display:inline-flex;gap:8px;align-items:center;font-size:13px;color:var(--ink-2);cursor:pointer}
.check input{accent-color:var(--accent);width:16px;height:16px}

/* story card */
.feed{display:grid;gap:14px}
.story{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 18px 14px;display:grid;gap:12px;scroll-margin-top:12px}
.story .when{font-size:13px;color:var(--muted)}
.story h3{font:500 20px/1.3 var(--display);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.story h3 .arrow{color:var(--muted);font-family:var(--body)}
.story p{margin:0}
.sub{font-size:14px;color:var(--ink-2)}
.main{font-size:15px;background:var(--surface-2);border-radius:8px;padding:10px 12px}
.main b{font-weight:600}
.note{font-size:13px;color:var(--warn-ink);background:var(--warn-bg);border-radius:8px;padding:7px 11px}
.flag{display:inline-block;font-size:12px;color:var(--muted);border:1px dashed var(--muted);border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:2px;font-family:var(--body);font-weight:400}
.lines{display:grid}
.ln{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) minmax(0,1.1fr);gap:4px 14px;align-items:baseline;padding:9px 0;border-top:1px solid var(--line)}
.ln:first-child{border-top:0}
.ln .nm{font-size:15px}
.ln .nm small{color:var(--muted);font-size:13px}
.ln .vals{font-variant-numeric:tabular-nums;font-size:15px;white-space:nowrap}
.ln .vals .was{color:var(--muted)}
.ln .vals b{font-weight:600}
.ch{font-size:14px;font-weight:500}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--muted)}
.rv{text-decoration:underline dotted var(--muted);text-underline-offset:3px}
.zrow{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:14px;font-variant-numeric:tabular-nums}
.zrow span{white-space:nowrap}
.zrow em{font-style:normal;color:var(--muted)}
.ln.wide{grid-template-columns:minmax(0,1.25fr) minmax(0,2.1fr)}
.shares{display:grid;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.shares .t{font-size:15px}
.shares .t small{color:var(--muted);font-size:13px}
.sbar{display:grid;grid-template-columns:minmax(64px,auto) minmax(0,1fr);gap:10px;align-items:center;font-size:13px}
.sbar .who{white-space:nowrap}
.stack{display:flex;gap:2px;height:26px}
.stack div{border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--z-ink);min-width:0;overflow:hidden;white-space:nowrap}
.stack .z1{background:var(--z1);color:var(--z1-ink)} .stack .z2{background:var(--z2)} .stack .z3{background:var(--z3)}
.zkey{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.zkey i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
details.more summary{cursor:pointer;font-size:14px;color:var(--ink-2);padding:6px 0;list-style-position:inside}
details.more[open] summary{margin-bottom:4px}
.empty{padding:16px;border:1px dashed var(--line);border-radius:10px;color:var(--ink-2);font-size:15px}
.free{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:end}
.free label{display:grid;gap:4px;font-size:13px;color:var(--ink-2);min-width:0}
.free select{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.swap{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:40px;height:40px;font-size:18px}
.foot{font-size:13px;color:var(--muted);margin:0;max-width:70ch}
@media (max-width:640px){
  .ln,.ln.wide{grid-template-columns:minmax(0,1fr);gap:2px}
  .ln .ch{font-size:13px}
  .free{grid-template-columns:minmax(0,1fr)}
  .story{padding:16px 14px 12px}
  .story h3{font-size:18px}
}
</style>

<div class="wrap">
  <header class="lead">
    <span class="eyebrow">УПЭ · история режимов</span>
    <h1>Смены марок</h1>
    <p id="intro"></p>
  </header>

  <section aria-label="Календарь марок" style="display:grid;gap:10px">
    <div class="legend" id="legend"></div>
    <div class="cal" id="cal"></div>
  </section>

  <div class="controls">
    <span class="lbl">Марка</span>
    <div class="chips" id="chips"></div>
    <div class="seg" role="group" aria-label="С чем сравнивать">
      <button id="agg-edge" aria-pressed="true" title="Последние снимки до смены и первые после">Ближайшие снимки</button>
      <button id="agg-mean" aria-pressed="false" title="Среднее по всем снимкам марки до и после смены">Среднее за период</button>
    </div>
    <label class="check"><input type="checkbox" id="only-conf">Только сверенные цифры</label>
  </div>

  <section class="feed" id="feed" aria-live="polite"></section>

  <section style="display:grid;gap:12px">
    <h2 class="month">Сравнить любые два замера</h2>
    <div class="free">
      <label>Было<select id="free-a"></select></label>
      <button class="swap" id="swap" aria-label="Поменять местами" title="Поменять местами">⇄</button>
      <label>Стало<select id="free-b"></select></label>
    </div>
    <div id="free-out"></div>
  </section>

  <p class="foot" id="foot"></p>
</div>

<script>
const D=/*__SMENY_DATA__*/null;
(function(){
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k,d){try{const v=localStorage.getItem('smeny:'+k);return v===null?d:JSON.parse(v);}catch{return d;}},set(k,v){try{localStorage.setItem('smeny:'+k,JSON.stringify(v));}catch{}}};
const P=Object.fromEntries(D.params.map(p=>[p.key,p]));
const PORDER=Object.fromEntries(D.params.map((p,i)=>[p.key,i]));
const G=Object.fromEntries(D.grades.map(g=>[g.id,g]));
const LINE={A:'А',B:'Б'};
const M_NOM=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const M_GEN=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const M_SH=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];

/* ---------- data ---------- */
const obs=D.observations.map(o=>({...o,t:Date.parse(o.ts+'Z'),vals:D.values[o.id]||{}})).sort((a,b)=>a.t-b.t||a.line.localeCompare(b.line));
const byId=Object.fromEntries(obs.map(o=>[o.id,o]));
const counts={};obs.forEach(o=>counts[o.grade]=(counts[o.grade]||0)+1);
/* Colour follows the grade: slots by number of observations, then name. */
const slot={};D.grades.slice().sort((a,b)=>(counts[b.id]||0)-(counts[a.id]||0)||a.name.localeCompare(b.name)).forEach((g,i)=>slot[g.id]=i<8?i+1:0);
const gc=id=>`var(--g${slot[id]??0})`;
const gp=id=>`<span class="gp" style="--c:${gc(id)}">${esc(G[id]?.name??'?')}</span>`;
const lines=[...new Set(obs.map(o=>o.line))].sort();
/* Runs of one grade on one line; the border between two runs is a grade change seen on neighbouring photos. */
const runs=[],pairs=[];
for(const line of lines){let cur=null;for(const o of obs.filter(x=>x.line===line)){if(!cur||cur.grade!==o.grade){cur={line,grade:o.grade,items:[]};runs.push(cur);}cur.items.push(o);}}
for(const line of lines){const rs=runs.filter(r=>r.line===line);for(let i=1;i<rs.length;i++)pairs.push({from:rs[i-1],to:rs[i]});}
pairs.sort((a,b)=>a.to.items[0].t-b.to.items[0].t);
pairs.forEach((p,i)=>{p.i=i;p.gapH=(p.to.items[0].t-p.from.items.at(-1).t)/36e5;p.dup=duplicate(p.from.items.at(-1),p.to.items[0]);const d=new Date(p.to.items[0].t);p.ym=d.getUTCFullYear()*12+d.getUTCMonth();});
function duplicate(a,b){const keys=Object.keys(a.vals).filter(k=>k in b.vals);return keys.length>=5&&keys.every(k=>a.vals[k][0]===b.vals[k][0])?keys.length:0;}

/* ---------- words and numbers ---------- */
const two=n=>String(n).padStart(2,'0');
const ymName=ym=>`${M_NOM[ym%12]} ${Math.floor(ym/12)}`;
function day(t,year=true){const d=new Date(t);return `${d.getUTCDate()} ${M_GEN[d.getUTCMonth()]}${year?' '+d.getUTCFullYear():''}, ${two(d.getUTCHours())}:${two(d.getUTCMinutes())}`;}
function plural(n,one,few,many){const a=Math.abs(n)%100,b=a%10;return a>10&&a<20?many:b===1?one:b>1&&b<5?few:many;}
function gapText(h){if(h<1)return `${Math.max(1,Math.round(h*60))} мин`;if(h<48){const n=Math.round(h);return `${n} ${plural(n,'час','часа','часов')}`;}const d=Math.round(h/24);return `${d} ${plural(d,'день','дня','дней')}`;}
function num(v,p=2){if(v==null||!Number.isFinite(v))return '—';const a=Math.abs(v),q=a>=100?Math.min(p,1):p;return v.toLocaleString('ru-RU',{minimumFractionDigits:0,maximumFractionDigits:q}).replace(/ /g,' ');}
const prec=k=>Number.isInteger(P[k]?.precision)?P[k].precision:2;
const unitOf=k=>P[k]?.unit||'';
/* Plain-language change: temperatures and percentages in absolute terms, flows as «в N раза» or «на N %». */
function change(a,b,u,p){
  const d=b-a,abs=u==='°C'||u==='%',temp=u==='°C';
  const more=temp?'выше':'больше',less=temp?'ниже':'меньше';
  if(Math.abs(d)<1e-9)return {cls:'flat',text:'без изменений',score:0};
  const cls=d>0?'up':'down',arrow=d>0?'▲':'▼',word=d>0?more:less;
  if(abs)return {cls,text:`${arrow} ${word} на ${num(Math.abs(d),p)}${u==='°C'?' °C':''}`,score:temp?Math.abs(d)*2:Math.abs(d)};
  if(a===0)return {cls,text:`${arrow} ${word}`,score:100};
  const pct=100*d/Math.abs(a),r=b/a;
  if(Math.abs(pct)<1)return {cls:'flat',text:'почти без изменений',score:0};
  if(r>=1.5)return {cls,text:`${arrow} ${word} в ${num(r,1)} раза`,score:Math.abs(pct)};
  if(r>0&&r<=1/1.5)return {cls,text:`${arrow} ${word} в ${num(1/r,1)} раза`,score:Math.abs(pct)};
  return {cls,text:`${arrow} ${word} на ${num(Math.abs(pct),0)} %`,score:Math.abs(pct)};
}
const SHORT={pal:'ПАЛ',pal_sp:'уставка ПАЛ',sum:'инициатор всего',mfr:'ПТР',mfr_raw:'исходный ПТР',c3_flow:'пропилен',propylene:'пропилен',drive_current:'ток привода',rpm:'обороты А-404',vgvd:'давление ВГВД',load:'нагрузка привода'};
for(const z of [1,2,3]){SHORT['z'+z+'_f']=`инициатор в ${z}-ю зону`;SHORT['z'+z+'_sp']=`уставка Т ${z}-й зоны`;SHORT['z'+z+'_t']=`Тмакс ${z}-й зоны`;}

/* ---------- state ---------- */
const S={agg:store.get('agg','edge'),confirmed:store.get('confirmed',false),grade:null};
{const withVals=obs.filter(o=>Object.keys(o.vals).length);S.freeA=withVals.at(-2)?.id??obs[0]?.id;S.freeB=withVals.at(-1)?.id??obs[0]?.id;}

function sideValues(items,fromEnd,agg){
  const seq=fromEnd?[...items].reverse():items,out={},ok=v=>!S.confirmed||v[1]==='confirmed';
  if(agg==='mean'){
    const acc={};for(const o of seq)for(const [k,v] of Object.entries(o.vals))if(ok(v))(acc[k]??=[]).push(v);
    for(const [k,l] of Object.entries(acc))out[k]={v:l.reduce((s,x)=>s+x[0],0)/l.length,status:l.every(x=>x[1]==='confirmed')?'confirmed':'review',n:l.length};
  }else for(const o of seq)for(const [k,v] of Object.entries(o.vals))if(!(k in out)&&ok(v))out[k]={v:v[0],status:v[1],n:1};
  const f=[1,2,3].map(z=>out['z'+z+'_f']||out['initiator'+z]);
  if(f.every(Boolean)){
    const sum=f.reduce((s,x)=>s+x.v,0),st=f.every(x=>x.status==='confirmed')?'confirmed':'review';
    out.sum={v:sum,status:st};
    if(sum>0){out.share=f.map(x=>({v:100*x.v/sum,status:st}));if(out.pal)out.palSum={v:out.pal.v/sum,status:out.pal.status==='confirmed'?st:'review'};}
    f.forEach((x,i)=>out['z'+(i+1)+'_f']??=x);
  }
  if(out.pal&&out.c3_flow&&out.c3_flow.v>0)out.palC3={v:out.pal.v/out.c3_flow.v,status:out.pal.status==='confirmed'&&out.c3_flow.status==='confirmed'?'confirmed':'review'};
  return out;
}
function docFor(o){if(!o)return null;if(o.doc)return D.docs.find(d=>d.id===o.doc)||null;const day=o.ts.slice(0,10);return D.docs.find(d=>d.grade===o.grade&&d.from<=day&&(!d.to||day<=d.to))||null;}

/* ---------- one story ---------- */
let MIXED=false;
const val=(x,p)=>MIXED&&x.status==='review'?`<span class="rv" title="Не сверено с фото">${num(x.v,p)}</span>`:num(x.v,p);
function line(name,u,a,b,p){
  const c=change(a.v,b.v,u,p);
  return `<div class="ln"><span class="nm">${esc(name)}${u?` <small>${esc(u)}</small>`:''}</span><span class="vals"><span class="was">${val(a,p)}</span> → <b>${val(b,p)}</b></span><span class="ch ${c.cls}">${c.text}</span></div>`;
}
function zoneLine(name,u,suffix,A,B){
  const parts=[1,2,3].map(z=>{const k='z'+z+'_'+suffix,a=A[k],b=B[k];if(!a||!b)return '';const p=prec(k),c=change(a.v,b.v,u,p);return `<span><em>${z}-я</em> ${val(a,p)} → <b>${val(b,p)}</b> <span class="${c.cls}">${c.cls==='flat'?'=':c.cls==='up'?'▲':'▼'}</span></span>`;}).filter(Boolean);
  if(!parts.length)return '';
  return `<div class="ln wide"><span class="nm">${esc(name)} <small>${esc(u)}</small></span><div class="zrow">${parts.join('')}</div></div>`;
}
function sharesBlock(A,B,ga,gb,la,lb){
  if(!A.share||!B.share)return '';
  const bar=(s,who,g)=>`<div class="sbar"><span class="who"><span class="gp" style="--c:${gc(g)}">${esc(who)}</span></span><div class="stack">${s?s.map((x,i)=>`<div class="z${i+1}" style="flex:${x.v}" title="Зона ${i+1}: ${num(x.v,1)} %">${x.v>=10?num(x.v,0)+' %':''}</div>`).join(''):'<div style="flex:1;background:var(--surface-2);color:var(--muted);font-weight:400">нет всех трёх зон</div>'}</div></div>`;
  let words='';
  if(A.share&&B.share){
    const d=[0,1,2].map(i=>B.share[i].v-A.share[i].v),i=d.reduce((m,x,j)=>x>d[m]?j:m,0);
    words=d[i]>=3?` Больше инициатора стало уходить в ${i+1}-ю зону: ${num(A.share[i].v,0)} % → ${num(B.share[i].v,0)} %.`:' Распределение почти не изменилось.';
  }
  return `<div class="shares"><span class="t">Как инициатор делится по зонам<small> · доля от суммы трёх зон</small>${words?`<br><small style="font-size:14px;color:var(--ink-2)">${words.trim()}</small>`:''}</span>${bar(A.share,la,ga)}${bar(B.share,lb,gb)}<div class="zkey"><span><i style="background:var(--z1)"></i>1-я зона</span><span><i style="background:var(--z2)"></i>2-я</span><span><i style="background:var(--z3)"></i>3-я</span></div></div>`;
}
const MAIN=['pal','sum','#f','#share','#sp','mfr','c3_flow','propylene','drive_current','rpm'];
function story(o){
  const {itemsA,itemsB,A,B,ga,gb}=o;
  const shown=[...Object.entries(A),...Object.entries(B)].filter(([k,x])=>B[k]&&A[k]&&x&&x.status),rev=shown.filter(([,x])=>x.status==='review').length;
  MIXED=rev>0&&rev<shown.length;
  const check=!shown.length?'':rev===shown.length?' Цифры ещё не сверены с фото.':rev?' Подчёркнутые пунктиром цифры ещё не сверены с фото.':' Все цифры сверены с фото.';
  const flags=o.warn||[];
  const both=k=>A[k]&&B[k];
  /* «Главное»: up to three biggest changes, in words. */
  const cands=['pal','sum','mfr','c3_flow','propylene','drive_current','rpm','z1_sp','z2_sp','z3_sp','z1_f','z2_f','z3_f'].filter(both).map(k=>{const u=k==='sum'?unitOf('z1_f'):unitOf(k);return {k,c:change(A[k].v,B[k].v,u,k==='sum'?2:prec(k))};}).filter(x=>x.c.score>=10).sort((a,b)=>b.c.score-a.c.score).slice(0,3);
  const common=Object.keys(A).filter(k=>B[k]&&!['share'].includes(k));
  let main;
  if(!common.length)main=`<p class="main">Сравнить нечего: до и после смены сняты разные экраны пульта, общих цифр нет.${S.agg==='edge'?' Попробуйте «Среднее за период».':''}</p>`;
  else if(!cands.length)main=`<p class="main"><b>Главное:</b> крупных изменений нет — общие цифры сдвинулись меньше чем на 10 %.</p>`;
  else main=`<p class="main"><b>Главное:</b> ${cands.map(x=>`${SHORT[x.k]||P[x.k]?.name||x.k} — <span class="${x.c.cls}">${x.c.text.replace(/^[▲▼] /,'')}</span>`).join('; ')}.</p>`;

  const used=new Set(['share','palSum','palC3']);
  const parts=[];
  const add=(k,name,u,p)=>{if(both(k)){parts.push(line(name,u,A[k],B[k],p));}used.add(k);};
  for(const m of MAIN){
    if(m==='#f'){parts.push(zoneLine('Инициатор по зонам',unitOf('z1_f')||'кг/ч','f',A,B));[1,2,3].forEach(z=>{used.add('z'+z+'_f');used.add('initiator'+z);});}
    else if(m==='#share')parts.push(sharesBlock(A,B,ga,gb,o.la,o.lb));
    else if(m==='#sp'){parts.push(zoneLine('Уставки температуры зон','°C','sp',A,B));[1,2,3].forEach(z=>used.add('z'+z+'_sp'));}
    else if(m==='sum')add('sum','Инициатор, всего',unitOf('z1_f')||'кг/ч',2);
    else add(m,P[m]?.name||m,unitOf(m),prec(m));
  }
  /* the rest, folded */
  const rest=[];
  rest.push(zoneLine('Тмакс зон','°C','t',A,B));[1,2,3].forEach(z=>used.add('z'+z+'_t'));
  rest.push(zoneLine('Открытие клапанов инициатора','%','out',A,B));[1,2,3].forEach(z=>used.add('z'+z+'_out'));
  if(both('palSum'))rest.push(line('ПАЛ на 1 кг инициатора','кг',A.palSum,B.palSum,3));
  if(both('palC3'))rest.push(line('ПАЛ на 1 м³ пропилена','кг',A.palC3,B.palC3,4));
  Object.keys(A).filter(k=>B[k]&&!used.has(k)).sort((a,b)=>(PORDER[a]??999)-(PORDER[b]??999)).forEach(k=>rest.push(line(P[k]?.name||k,unitOf(k),A[k],B[k],prec(k))));
  const restHtml=rest.filter(Boolean);
  const onlyOne=[...new Set([...Object.keys(A),...Object.keys(B)])].filter(k=>!(A[k]&&B[k])&&P[k]);
  const da=docFor(itemsA.at(-1)),db=docFor(itemsB[0]);
  const normLines=normsWords(da,db);


  return `<article class="story" ${o.id?`id="${o.id}"`:''}>
    <span class="when">${o.when}</span>
    <h3>${gp(ga)}<span class="arrow">→</span>${gp(gb)}${o.badge||''}</h3>
    <p class="sub">${o.sub}${check}</p>
    ${flags.map(f=>`<p class="note">${f}</p>`).join('')}
    ${main}
    ${common.length?`<div class="lines">${parts.filter(Boolean).join('')}</div>`:''}
    ${restHtml.length||normLines||onlyOne.length?`<details class="more"><summary>Подробнее${restHtml.length?`: ещё ${restHtml.length} ${plural(restHtml.length,'показатель','показателя','показателей')}`:''}${normLines?', нормы техкарт':''}</summary>${restHtml.length?`<div class="lines">${restHtml.join('')}</div>`:''}${normLines}${onlyOne.length?`<p class="sub" style="margin-top:8px">Есть только с одной стороны, сравнить нельзя: ${onlyOne.map(k=>esc(P[k].name)).join(', ')}.</p>`:''}</details>`:''}
  </article>`;
}
function normsWords(da,db){
  if(!da&&!db)return '';
  const nr=d=>Object.fromEntries(D.norms.filter(n=>n.doc===d?.id).map(n=>[n.key,n]));
  const na=nr(da),nb=nr(db),keys=[...new Set([...Object.keys(na),...Object.keys(nb)])].sort((a,b)=>(PORDER[a]??999)-(PORDER[b]??999));
  if(!keys.length)return '';
  const r=n=>n?(n.lo!==null&&n.hi!==null?`${num(n.lo,3)}–${num(n.hi,3)}`:n.lo!==null?`не менее ${num(n.lo,3)}`:n.hi!==null?`не более ${num(n.hi,3)}`:'без границ'):'нет';
  const ga=da?.grade,gb=db?.grade;
  return `<div class="lines" style="margin-top:6px"><p class="sub" style="padding:6px 0">Нормы по техкартам${da?`: ${esc(G[ga].name)} — версия ${esc(da.version)}`:''}${db?`, ${esc(G[gb].name)} — версия ${esc(db.version)}`:''}</p>${keys.map(k=>`<div class="ln"><span class="nm">${esc(P[k]?.name||k)}${unitOf(k)?` <small>${esc(unitOf(k))}</small>`:''}</span><span class="vals"><span class="was">${r(na[k])}</span> → <b>${r(nb[k])}</b></span><span class="ch ${JSON.stringify(na[k]&&[na[k].lo,na[k].hi])===JSON.stringify(nb[k]&&[nb[k].lo,nb[k].hi])?'flat':''}">${JSON.stringify(na[k]&&[na[k].lo,na[k].hi])===JSON.stringify(nb[k]&&[nb[k].lo,nb[k].hi])?'норма та же':'норма другая'}</span></div>`).join('')}</div>`;
}
function pairStory(p){
  const A=sideValues(p.from.items,true,S.agg),B=sideValues(p.to.items,false,S.agg);
  const a=p.from.items,b=p.to.items,na=G[p.from.grade].name,nb=G[p.to.grade].name;
  const sub=S.agg==='edge'
    ?`Линия ${LINE[p.from.line]}. Было: ${esc(na)}, последний снимок ${day(a.at(-1).t)}. Стало: ${esc(nb)}, первый снимок ${day(b[0].t)}. Между снимками ${gapText(p.gapH)}.`
    :`Линия ${LINE[p.from.line]}. Сравниваются средние: ${esc(na)} — ${a.length} ${plural(a.length,'снимок','снимка','снимков')} (${day(a[0].t,false)} — ${day(a.at(-1).t)}), ${esc(nb)} — ${b.length} ${plural(b.length,'снимок','снимка','снимков')} (${day(b[0].t,false)} — ${day(b.at(-1).t)}).`;
  const warn=[];
  if(p.gapH>72)warn.push(`Между снимками ${gapText(p.gapH)} — за это время могли быть и другие марки.`);
  if(p.dup)warn.push(`Похоже на ошибку в базе: у обеих марок совпадают все ${p.dup} общих цифр. Возможно, один и тот же снимок записан на две марки.`);
  return story({id:'p'+p.i,itemsA:a,itemsB:b,A,B,ga:p.from.grade,gb:p.to.grade,la:na,lb:nb,
    when:`${ymName(p.ym)} · смена №${p.i+1} из ${pairs.length}`,sub,warn});
}

/* ---------- page ---------- */
function renderIntro(){
  const all=Object.values(D.values).flatMap(v=>Object.values(v)),conf=all.filter(v=>v[1]==='confirmed').length;
  $('intro').innerHTML=obs.length?`Что менялось в режиме, когда линия переходила с одной марки на другую. В базе ${obs.length} ${plural(obs.length,'замер','замера','замеров')} с ${day(obs[0].t,true).split(',')[0]} по ${day(obs.at(-1).t,true).split(',')[0]}, найдено <b>${pairs.length}</b> ${plural(pairs.length,'смена','смены','смен')} марки. Сверено с фото ${conf} из ${all.length} цифр, остальные предварительные. Точный момент перехода неизвестен: сравниваются снимки до и после смены.`:'В базе пока нет замеров.';
  $('foot').textContent=`Смена марки определяется по соседним снимкам в базе, точный момент перехода неизвестен. Данные из рабочей базы на ${D.generated_at.slice(0,10).split('-').reverse().join('.')}; отклонённые варианты цифр не показываются.`;
}
function renderCalendar(){
  if(!obs.length){$('cal').innerHTML='';return;}
  const ymOf=t=>{const d=new Date(t);return d.getUTCFullYear()*12+d.getUTCMonth();};
  const y0=ymOf(obs[0].t),y1=ymOf(obs.at(-1).t),tiles=[];
  for(let ym=y0;ym<=y1;ym++){
    const inM=obs.filter(o=>ymOf(o.t)===ym),ch=pairs.filter(p=>p.ym===ym&&vis(p)).length;
    const seq=[];for(const l of lines){const s=[];for(const o of inM.filter(o=>o.line===l))if(s.at(-1)!==o.grade)s.push(o.grade);if(s.length)seq.push((lines.length>1?`<span>${LINE[l]}</span>`:'')+s.map(g=>`<i style="--c:${gc(g)}" title="${esc(G[g].name)}"></i>`).join(''));}
    tiles.push(`<button class="mon ${ch?'has':''}" data-ym="${ym}" ${ch?'':'disabled'} title="${ch?'Показать смены этого месяца':'Смен марки в этом месяце нет'}"><span class="mname">${M_SH[ym%12]} ${String(Math.floor(ym/12)).slice(2)}<span>${ch?`${ch} ${plural(ch,'смена','смены','смен')}`:inM.length?'':'нет снимков'}</span></span><span class="seq">${seq.join('<br>')}</span></button>`);
  }
  $('cal').innerHTML=tiles.join('');
  $('legend').innerHTML=D.grades.filter(g=>counts[g.id]).sort((a,b)=>slot[a.id]-slot[b.id]).map(g=>gp(g.id)).join('');
}
const vis=p=>S.grade===null||p.from.grade===S.grade||p.to.grade===S.grade;
function renderChips(){
  $('chips').innerHTML=`<button class="chip" data-g="" aria-pressed="${S.grade===null}">Все</button>`+D.grades.filter(g=>counts[g.id]).sort((a,b)=>slot[a.id]-slot[b.id]).map(g=>`<button class="chip" data-g="${g.id}" aria-pressed="${S.grade===g.id}">${esc(g.name)}</button>`).join('');
  $('agg-edge').setAttribute('aria-pressed',S.agg==='edge');$('agg-mean').setAttribute('aria-pressed',S.agg==='mean');
  $('only-conf').checked=S.confirmed;
}
function renderFeed(){
  const list=pairs.filter(vis);
  if(!list.length){$('feed').innerHTML=`<div class="empty">${pairs.length?'С этой маркой смен не найдено.':'Соседних снимков разных марок в базе пока нет. Сравните два любых замера ниже.'}</div>`;return;}
  let html='',ym=null;
  for(const p of list){if(p.ym!==ym){ym=p.ym;html+=`<h2 class="month" id="m${ym}">${ymName(ym)}</h2>`;}html+=pairStory(p);}
  $('feed').innerHTML=html;
}
function renderFree(){
  const opts=sel=>obs.map(o=>`<option value="${o.id}" ${o.id===sel?'selected':''}>${day(o.t)} · ${esc(G[o.grade].name)} · линия ${LINE[o.line]}</option>`).join('');
  $('free-a').innerHTML=opts(S.freeA);$('free-b').innerHTML=opts(S.freeB);
  const a=byId[S.freeA],b=byId[S.freeB];
  if(!a||!b){$('free-out').innerHTML='';return;}
  const warn=[];
  if(a.id===b.id)warn.push('Выбран один и тот же замер.');
  if(a.line!==b.line)warn.push('Замеры с разных линий — условия могут быть несопоставимы.');
  const d=duplicate(a,b);if(d&&a.grade!==b.grade)warn.push(`У разных марок совпадают все ${d} общих цифр — возможно, один снимок записан на две марки.`);
  const h=Math.abs(b.t-a.t)/36e5;
  $('free-out').innerHTML=story({itemsA:[a],itemsB:[b],A:sideValues([a],false,'edge'),B:sideValues([b],false,'edge'),ga:a.grade,gb:b.grade,la:G[a.grade].name,lb:G[b.grade].name,
    when:'Свой выбор',sub:`Было: ${esc(G[a.grade].name)}, линия ${LINE[a.line]}, ${day(a.t)}. Стало: ${esc(G[b.grade].name)}, линия ${LINE[b.line]}, ${day(b.t)}. ${b.t<a.t?'«Стало» снято раньше, чем «было»':'Между замерами'} — ${gapText(h)}.`,warn});
}
function renderAll(){renderChips();renderCalendar();renderFeed();renderFree();}

$('chips').onclick=e=>{const b=e.target.closest('[data-g]');if(!b)return;S.grade=b.dataset.g===''?null:Number(b.dataset.g);renderAll();};
$('agg-edge').onclick=()=>{S.agg='edge';store.set('agg','edge');renderAll();};
$('agg-mean').onclick=()=>{S.agg='mean';store.set('agg','mean');renderAll();};
$('only-conf').onchange=e=>{S.confirmed=e.target.checked;store.set('confirmed',S.confirmed);renderAll();};
$('cal').onclick=e=>{const b=e.target.closest('[data-ym]');if(b&&!b.disabled)$('m'+b.dataset.ym)?.scrollIntoView({block:'start'});};
$('free-a').onchange=e=>{S.freeA=Number(e.target.value);renderFree();};
$('free-b').onchange=e=>{S.freeB=Number(e.target.value);renderFree();};
$('swap').onclick=()=>{[S.freeA,S.freeB]=[S.freeB,S.freeA];renderFree();};
renderIntro();renderAll();
})();
</script>
